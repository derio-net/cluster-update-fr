name: ci

# This file lives in .github/workflows/ on purpose: Gitea Actions reads both
# .github/ and .gitea/, GitHub reads only .github/, so one file here builds on
# both forges.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build (no push)
        run: docker build -t cluster-update-fr:ci .
