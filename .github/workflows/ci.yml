name: ci

# This file lives in .github/workflows/ on purpose: Gitea Actions reads both
# .github/ and .gitea/, GitHub reads only .github/, so one file here builds on
# both forges. Actions are pinned by full commit SHA (c1s-r7).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: build (no push)
        run: docker build -t cluster-update-fr:ci .
