name: release

# Publish the image on v* tags. Frank pins ghcr.io/derio-net/cluster-update-fr
# by bare semver (0.1.0), so `type=semver,pattern={{version}}` is the tag that
# matters; the git tag and the commit sha are published alongside it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Gitea Actions reads .github/workflows/ too; publishing to GHCR is a
    # GitHub-only job, so the mirror must never run it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/derio-net/cluster-update-fr
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
